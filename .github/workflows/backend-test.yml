name: Backend Tests (PostgreSQL)

on:
  workflow_dispatch:  # Manual trigger only — no automatic emails on push

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sais_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run migrations on test database
        env:
          ENVIRONMENT: "test"
          ALEMBIC_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/sais_test"
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/sais_test"
          ENV_FILE: ""
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run backend tests against PostgreSQL
        env:
          ENVIRONMENT: "test"
          TEST_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/sais_test"
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/sais_test"
          SECRET_KEY: "ci-test-secret-key-min-32-chars-for-github-actions"
          ENV_FILE: ""
        run: |
          pytest -v -m postgres --run-postgres

